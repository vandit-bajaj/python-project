name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint, Typecheck & License Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Run Biome check (lint & format)
        run: pnpm check

      - name: Dependency License Gate
        run: pnpm check:licenses

      - name: Typecheck
        run: pnpm typecheck

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        run: pnpm test

  build-and-e2e:
    name: Build & Playwright Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Build Web & Packages
        run: pnpm build

      - name: Install Playwright Browsers
        run: pnpm --filter web exec playwright install --with-deps chromium webkit

      - name: Run Playwright Smoke & Zero Outbound Requests Test
        run: pnpm test:e2e
