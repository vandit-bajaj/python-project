pre-commit:
  commands:
    check:
      glob: "*.{js,ts,jsx,tsx,json,css}"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    license-gate:
      run: node scripts/check-licenses.mjs

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
